# KataGo analysis 配置 —— 为本原型精简自 analysis_example.cfg（CPU/GPU 通用）
# 注释值 = 默认值。KataGo 会用引擎内置默认值填充未列出的项。

# ---- 搜索强度（原型优先快速，可后续调高）----
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 8
maxVisits = 200

# 胜率/目差统一以【黑方视角】报告（UI 胜率条直观）
reportAnalysisWinratesAs = BLACK

# 分析时的主变长度
analysisPVLen = 12
# 分析时根节点稍加探索（0=最强；设小正数可看到更多候选）
wideRootNoise = 0.0

# 神经网络批量与缓存（OpenCL 后端需要 nnMaxBatchSize；换局面时命中缓存可加速）
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 16

# CPU(Eigen) 后端线程数
numEigenThreadsPerModel = 8

# 日志（关掉大部分，减少磁盘写入）
logDir = analysis_logs
logAllRequests = false
logAllResponses = false
logSearchInfo = false
logErrorsAndWarnings = true
